# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: school-lunch-mirror
  namespace: radicale
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      school-lunch-mirror:
        type: cronjob
        cronjob:
          # Daily: menus are published weeks ahead, so this is about noticing
          # revisions rather than fetching anything new.
          schedule: "12 5 * * *"
          suspend: false
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image:
              repository: python
              tag: 3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
            command: ["python", "/app/school_lunch_mirror.py"]
            env:
              RADICALE_URL: http://radicale.radicale.svc.cluster.local:5232
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    persistence:
      script:
        type: configMap
        name: school-lunch-mirror-configmap
        globalMounts:
          - path: /app/school_lunch_mirror.py
            subPath: school_lunch_mirror.py
            readOnly: true
      config:
        type: secret
        name: school-lunch-mirror-secret
        globalMounts:
          - path: /config/config.json
            subPath: config.json
            readOnly: true
