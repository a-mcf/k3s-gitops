---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-vllm-metrics
  namespace: flux-system
spec:
  path: ./cluster/apps/ai/vllm-metrics/app
  dependsOn:
    - name: cluster-apps-kube-prometheus-stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
