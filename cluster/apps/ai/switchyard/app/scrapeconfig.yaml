---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: switchyard
  namespace: ai
  labels:
    # Required: the Prometheus CR's scrapeConfigSelector matches on this, and a
    # ScrapeConfig without it is ignored with no error anywhere.
    release: kube-prometheus-stack
spec:
  metricsPath: /metrics
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - "${VLLM_GX10_HOST}:4000"
      labels:
        job: switchyard
