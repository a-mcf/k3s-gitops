---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system

  values:
    controllers:
      litellm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          litellm:
            image:
              repository: ghcr.io/berriai/litellm
              tag: v1.91.0
            args:
              - "--config"
              - "/etc/litellm/config.yaml"
              - "--port"
              - "4000"
            env:
              # Lights up virtual keys, per-key spend tracking, and the admin UI
              # (which returns "Not connected to DB!" on login without this).
              # CNPG publishes a ready-made connection string in <cluster>-app,
              # so there is nothing to assemble or keep in sync by hand.
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: litellm-cnpg-app
                    key: uri
              # STORE_MODEL_IN_DB is deliberately NOT set. It would let models be
              # added through the UI, and those live only in Postgres -- invisible
              # to git and silently divergent from the configmap. model_list stays
              # the single source of truth; the database is here for keys, spend
              # and the UI. Flip it on only if UI-managed models are ever wanted
              # more than a reviewable history of what this gateway serves.
            envFrom:
              - secretRef:
                  name: litellm-secret
            probes:
              # TCP probes for the MVP — robust against a path typo on first boot.
              # Upgrade to HTTP later: liveness /health/liveliness,
              # readiness /health/readiness (LiteLLM's own endpoints).
              #
              # With DATABASE_URL set, the first boot against an empty database
              # runs Prisma migrations before the port is bound. Liveness alone
              # would kill that at ~110s and crash-loop it; a startup probe holds
              # liveness and readiness off until the port answers.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                # LiteLLM spikes loading provider SDKs at startup; 1Gi OOMKilled it.
                memory: 2Gi

    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000

    ingress:
      app:
        className: traefik
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "LiteLLM"
          gethomepage.dev/group: "Gen-AI"
          gethomepage.dev/icon: "mdi-router-network"
        hosts:
          - host: "litellm.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

    persistence:
      config:
        type: configMap
        name: litellm-config
        globalMounts:
          - path: /etc/litellm
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
