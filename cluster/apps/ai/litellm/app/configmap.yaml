---
# LiteLLM proxy config. Postgres backs keys/spend/UI (see ../database).
# ⚠ Config rows stored in the DB deep-merge OVER this file and win, so a
# setting that appears ignored here may be overridden there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: local
        litellm_params:
          model: openai/gemma4-26b
          api_base: http://${LLM0_HOST}:8003/v1
          api_key: sk-noauth
      - model_name: gemma4-26b
        litellm_params:
          model: openai/gemma4-26b
          api_base: http://${LLM0_HOST}:8003/v1
          api_key: sk-noauth
      - model_name: gemma4-12b
        litellm_params:
          # Backend is scaled to 0; this alias 404s until it is toggled back up.
          model: openai/google/gemma-4-12B-it-qat-w4a16-ct
          api_base: http://vllm-router-service.ai.svc.cluster.local:80/v1
          api_key: sk-noauth
      - model_name: agent
        litellm_params:
          # ⚠ Backend is gone; this alias 404s. Left in place pending a decision
          # on what it should point at.
          model: openai/nemotron35-lightning
          api_base: http://${LLM0_HOST}:8000/v1
          api_key: sk-noauth
      - model_name: agent-precise
        litellm_params:
          model: openai/qwen38-27b
          api_base: http://${LLM0_HOST}:8001/v1
          api_key: sk-noauth
          # A request's own reasoning_effort overrides this; unset means the
          # backend's deepest setting. ⚠ Accepts low|medium|high|xhigh only --
          # anything else 400s rather than falling back to the default.
          reasoning_effort: medium
      - model_name: qwen38-27b
        litellm_params:
          model: openai/qwen38-27b
          api_base: http://${LLM0_HOST}:8001/v1
          api_key: sk-noauth
          reasoning_effort: medium
      - model_name: ornith15-35b
        litellm_params:
          # ⚠ reasoning_effort is accepted here and silently ignored -- this
          # model's template exposes thinking as on/off only.
          model: openai/ornith15-35b
          api_base: http://${LLM0_HOST}:8002/v1
          api_key: sk-noauth
      # Template for adding a hosted provider:
      # - model_name: cloud-hard
      #   litellm_params:
      #     model: anthropic/<model-id>          # see claude-api skill for IDs
      #     api_key: os.environ/ANTHROPIC_API_KEY

    litellm_settings:
      drop_params: true          # tolerate params a backend doesn't support
      # num_retries: 2

    router_settings:
      # ⚠ Must live under router_settings; the litellm_settings spelling is
      # legacy and silently ignored. Falling back to "local" succeeds with a
      # much smaller model -- a floor, not an equivalent.
      # ⚠ "agent" is currently a dead backend, so agent-precise's first hop
      # fails before reaching "local".
      fallbacks:
        - agent: ["agent-precise", "local"]
        - agent-precise: ["agent", "local"]

      # Makes context-window errors re-raise instead of walking `fallbacks`.
      # ⚠ Must be non-empty and must not name a real alias -- an empty list
      # collapses to None and silently restores fallback. Names are not
      # validated, so the sentinel below is deliberate, not a typo.
      context_window_fallbacks:
        - __no_context_window_fallback__: ["__none__"]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
