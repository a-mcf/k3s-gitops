---
# LiteLLM proxy config. Postgres backs keys/spend/UI (see ../database).
# ⚠ Config rows stored in the DB deep-merge OVER this file and win, so a
# setting that appears ignored here may be overridden there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: local
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: http://${LLM1_HOST}:18300/v1
          api_key: sk-noauth
          # Thinking on at reasoning_effort low, with the model card's
          # thinking-mode sampling. ⚠ LiteLLM REPLACES this extra_body when a
          # request carries its own (e.g. a client sending chat_template_kwargs
          # or proxy metadata), which silently drops back to the template
          # default (xhigh).
          temperature: 1.0
          top_p: 0.95
          extra_body:
            top_k: 20
            chat_template_kwargs:
              reasoning_effort: low
          # A hung backend accepts the request and never answers. The timeouts
          # bound each attempt; both retry layers (client and router) must be
          # off or the hung backend is retried before the fallback is tried.
          stream_timeout: 15
          timeout: 120
          max_retries: 0
          num_retries: 0
      - model_name: gemma4-12b
        litellm_params:
          # Backend is scaled to 0; this alias 404s until it is toggled back up.
          model: openai/google/gemma-4-12B-it-qat-w4a16-ct
          api_base: http://vllm-router-service.ai.svc.cluster.local:80/v1
          api_key: sk-noauth
      - model_name: qwen38-27b-3090
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: http://hyperqwen.ai.svc.cluster.local:18020/v1
          api_key: sk-noauth
          reasoning_effort: medium
      # Honcho's memory work (deriver, dialectic, summaries, dreams). No
      # fallback: at its default effort the gx10 27b thinks past the deriver's
      # output cap on every batch.
      - model_name: memory
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: http://${LLM1_HOST}:18300/v1
          api_key: sk-noauth
          reasoning_effort: medium
      - model_name: qwen38-flash-next
        litellm_params:
          model: openai/qwen3.8-flash-next
          api_base: http://${LLM1_HOST}:18300/v1
          api_key: sk-noauth
      # gx10. Inkling 2 Mini, on trial in place of nemotron-super (the two can't
      # share the box). Reasoning parser and tool parser are both `inkling`.
      - model_name: inkling-2-mini
        litellm_params:
          model: openai/inkling-2-mini
          api_base: http://${LLM0_HOST}:8004/v1
          api_key: sk-noauth
      # gx10. Nemotron 3.5 Super VL (120B-A12B). OFF while Inkling is on trial;
      # calls to this alias fail until it is restored. Reasoning is on by
      # default; send chat_template_kwargs.enable_thinking=false (or
      # reasoning_effort "none") to turn it off.
      - model_name: nemotron-super
        litellm_params:
          model: openai/nemotron-super
          api_base: http://${LLM0_HOST}:8003/v1
          api_key: sk-noauth
      # Template for adding a hosted provider:
      # - model_name: cloud-hard
      #   litellm_params:
      #     model: anthropic/<model-id>          # see claude-api skill for IDs
      #     api_key: os.environ/ANTHROPIC_API_KEY

    litellm_settings:
      drop_params: true          # tolerate params a backend doesn't support
      # num_retries: 2

    router_settings:
      # ⚠ Must live under router_settings; the litellm_settings spelling is
      # legacy and silently ignored. qwen38-27b-3090 is down while the 3090
      # serves chatterbox (hyperqwen at 0 replicas), so the gx10 model is
      # local's working fallback (inkling-2-mini while it is on trial).
      fallbacks:
        - local: ["inkling-2-mini", "nemotron-super", "qwen38-27b-3090"]

      # Makes context-window errors re-raise instead of walking `fallbacks`.
      # ⚠ Must be non-empty and must not name a real alias -- an empty list
      # collapses to None and silently restores fallback. Names are not
      # validated, so the sentinel below is deliberate, not a typo.
      context_window_fallbacks:
        - __no_context_window_fallback__: ["__none__"]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
