---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hyperqwen
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system

  # Helm applies and returns without waiting for readiness: a cold engine start
  # (CUDA graphs, kernel JIT) outlasts the Deployment progress deadline, which
  # would otherwise fail the release and roll the pod back mid-start. The
  # startup probe is the health gate instead.
  maxHistory: 2
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    defaultPodOptions:
      automountServiceAccountToken: false

    controllers:
      hyperqwen:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          runtimeClassName: nvidia
          nodeSelector:
            gpu: "true"
        # Recreate, not RollingUpdate: a second replica would start loading
        # weights onto the same card before the first released them.
        strategy: Recreate

        containers:
          app:
            image:
              repository: ghcr.io/syv-ai/hyperqwen
              tag: sha-fe09615@sha256:0ac55c696e39af8f781d7dc540d4df979923bc9feb1d0f2c515ddaec0dde1bcb
            # The image entrypoint takes a profile name, not vLLM flags. Before
            # serving it runs the idempotent prepare step and verify.sh, and
            # refuses to start if the model directory fails verification. The
            # model is prepared once, out of band, with
            # prepare/quant_heads_stream.py: the default prepare scripts load
            # whole shards and need more memory than a cluster node has.
            args: ["single"]
            env:
              TZ: "${TZ}"
              # The image writes its caches under $HOME; pointing it at the
              # persisted volume keeps them across restarts.
              HOME: /cache
              PORT: "18020"
              # 150k context: fp8 KV cache via FlashInfer with the MTP drafter.
              # DFlash2 with CTX=long falls back to an int8 Triton cache at 128k.
              SPEC: mtp
              CTX: long
              PREFIX_CACHE: "1"
              # Load the vision tower (off by default upstream). Its weights stay in
              # pinned host memory and are copied to the GPU per image, which is what
              # lets it coexist with the speculative decoder on 24GB.
              VISION: "1"
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: all
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 18020
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 18020
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 18020
                  periodSeconds: 10
                  # ~20m. A cold start compiles graphs and JITs kernels before
                  # /health answers; the liveness probe must not fire during it.
                  failureThreshold: 120
            resources:
              requests:
                cpu: 0
                memory: 4Gi
                # Zero, never one. The card is deliberately shared rather than
                # exclusively claimed, so replica counts are what arbitrate which
                # engine holds it; requesting 1 would park it against a single
                # workload. Declared rather than omitted so the GPU shows up in
                # the pod's resource profile for scheduling.
                nvidia.com/gpu: 0
              limits:
                # Extended resources reject a request without a matching limit.
                nvidia.com/gpu: 0

    service:
      app:
        controller: hyperqwen
        ports:
          http:
            port: 18020

    persistence:
      data:
        existingClaim: nfs-hyperqwen-data-pvc
        globalMounts:
          - path: /app/models
            subPath: hyperqwen/models
          - path: /cache
            subPath: hyperqwen/cache
      # The engine needs far more shared memory than the container default.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /dev/shm
