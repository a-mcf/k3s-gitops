---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hyperqwen
  namespace: ai
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system

  # First install runs the model preparation init container: a large download
  # plus a requantisation pass, then a cold engine start that builds CUDA graphs
  # and JITs kernels. 60m covers all of it; later upgrades are fast because both
  # the prepared weights and the compile cache are persisted.
  timeout: 60m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      runtimeClassName: nvidia

    controllers:
      # One-shot model preparation. A controller here rather than a bare Job
      # manifest so it matches every other workload in this repo — and so the
      # pod spec is generated by the chart rather than hand-written.
      #
      # Pinned, and only defensible because it genuinely runs once: the artefact
      # is permanent and Helm leaves a completed Job alone. It is on this node
      # because that is where the memory actually is — cluster memory requests
      # are over-provisioned against real usage, so the scheduler cannot see it.
      prepare:
        type: job
        # A Helm HOOK, not an ordinary resource. Without this the release
        # deadlocks: Helm aborts the upgrade on the stalled Deployment — stalled
        # precisely because the artefact does not exist yet — and so never gets
        # around to creating the Job that would produce it. As a pre-install /
        # pre-upgrade hook it runs to completion first, and the Deployment is
        # only applied afterwards.
        #
        # It therefore runs on every upgrade, which is fine and is the safer
        # shape: the step is idempotent and returns immediately once the weights
        # are prepared, so it doubles as a guarantee that they exist.
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-weight: "-5"
          # Keep the finished Job around until the next run so it can be read.
          helm.sh/hook-delete-policy: before-hook-creation
        pod:
          nodeSelector:
            kubernetes.io/hostname: k3s-node1
        job:
          backoffLimit: 3
        containers:
          prepare:
            image: &image
              repository: ghcr.io/syv-ai/hyperqwen
              tag: sha-fe09615@sha256:0ac55c696e39af8f781d7dc540d4df979923bc9feb1d0f2c515ddaec0dde1bcb
            args: ["prepare"]
            env:
              TZ: "${TZ}"
              HOME: /cache
              # No device needed, and asking for none keeps this off the card.
              NVIDIA_VISIBLE_DEVICES: "void"
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                # Requests stay small so it schedules; the limit covers the
                # requantisation peak, which is not yet measured.
                memory: 20Gi

      hyperqwen:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            gpu: "true"
        # Recreate, not RollingUpdate: a second replica would start loading
        # weights onto the same card before the first released them.
        strategy: Recreate
        initContainers:
          # Downloads the model and requantises it into the int8 tensor-core
          # layout the serving profile expects, writing to /app/models. Idempotent
          # — on every later start it finds the prepared weights and returns.
          prepare:
            image:
              repository: ghcr.io/syv-ai/hyperqwen
              tag: sha-fe09615@sha256:0ac55c696e39af8f781d7dc540d4df979923bc9feb1d0f2c515ddaec0dde1bcb
            args: ["prepare"]
            env: &baseEnv
              TZ: "${TZ}"
              # The image writes its caches under $HOME; pointing it at the
              # persisted volume keeps them across restarts.
              HOME: /cache
            envFrom: []
            resources:
              requests:
                cpu: "2"
                memory: 2Gi
              limits:
                # The heavy requantisation runs in hyperqwen-prepare-v1 on a node
                # with headroom. By the time this runs the artefact exists, so this
                # call only verifies and returns; it retries until the Job is done.
                memory: 8Gi

        containers:
          app:
            image: *image
            # The image entrypoint takes a profile name, not vLLM flags.
            args: ["single"]
            env:
              <<: *baseEnv
              PORT: "18020"
              # Speculative decoding profile and prefix caching, per the
              # upstream single-user defaults for a 24GB card.
              SPEC: dflash2
              PREFIX_CACHE: "1"
              # Set explicitly rather than inherited. This is what actually hands
              # the container the card — the vLLM images bake these in, and this
              # is not a vLLM image, so relying on the default would schedule
              # onto the GPU node and then find no device.
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: all
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 18020
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 18020
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 18020
                  periodSeconds: 10
                  # ~20m. A cold start compiles graphs and JITs kernels before
                  # /health answers; the liveness probe must not fire during it.
                  failureThreshold: 120
            resources:
              requests:
                cpu: 0
                memory: 4Gi
                # Zero, never one. The card is deliberately shared rather than
                # exclusively claimed, so replica counts are what arbitrate which
                # engine holds it; requesting 1 would park it against a single
                # workload. Declared rather than omitted so the GPU shows up in
                # the pod's resource profile for scheduling.
                nvidia.com/gpu: 0
              limits:
                # Extended resources reject a request without a matching limit.
                nvidia.com/gpu: 0

    service:
      app:
        controller: hyperqwen
        ports:
          http:
            port: 18020

    persistence:
      data:
        existingClaim: nfs-hyperqwen-data-pvc
        globalMounts:
          - path: /app/models
            subPath: hyperqwen/models
          - path: /cache
            subPath: hyperqwen/cache
      # The engine needs far more shared memory than the container default.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /dev/shm
