---
# Same NFS export as the vllm claim, but ReadWriteMany, so model preparation
# can run on a node other than the one serving it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-hyperqwen-data-pv
  namespace: ai
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  mountOptions:
    - nfsvers=4
    - port=2049
  nfs:
    path: /dumpster/appscratch/vllm
    server: "${NFS_SERVER}"
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-hyperqwen-data-pvc
  namespace: ai
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: nfs-hyperqwen-data-pv
