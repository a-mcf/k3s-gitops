---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-hyperqwen
  namespace: flux-system
spec:
  path: "./cluster/apps/ai/hyperqwen/app"
  dependsOn:
    - name: cluster-apps-nvidia-device-plugin
    # nfs-vllm-data-pvc is created by the vllm Kustomization and mounted here,
    # and that same Kustomization is what parks the other engine off the card.
    - name: cluster-apps-vllm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  # Long enough for the first install: prepare init container, then a cold
  # engine start.
  timeout: 60m
