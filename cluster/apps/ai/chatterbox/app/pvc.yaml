---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-chatterbox-pv
  namespace: ai
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  mountOptions:
    - nfsvers=4
    - port=2049
  nfs:
    path: /dumpster/appscratch/chatterbox
    server: "${NFS_SERVER}"
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-chatterbox-pvc
  namespace: ai
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  volumeName: nfs-chatterbox-pv
