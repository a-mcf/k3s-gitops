---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 2316
        runAsGroup: 2316
        fsGroup: 2316
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      syncthing:
        containers:
          syncthing:
            image:
              repository: syncthing/syncthing
              tag: 2.1.3
            resources:
              requests:
                cpu: 15m
                # Its index working set is well over the old 64M request, which
                # made scheduling decisions on a number nothing like reality.
                memory: 512Mi
              limits:
                cpu: 2000m
                # Raised from 2Gi: it sat pinned at 2046Mi and the cgroup evicted
                # page cache to stay under, so the memory-mapped index was read
                # back from disk continuously -- ~1,900 major faults/s and a full
                # core burned, with nothing in the logs and 13GiB free on the node.
                memory: 4Gi
    service:
      syncthing:
        controller: syncthing
        ports:
          http:
            port: 8384
      listen:
        enabled: true
        type: LoadBalancer
        controller: syncthing
        loadBalancerIP: "${SYNCTHING_IP}"
        ports:
          discovery:
            enabled: true
            port: 21027
            protocol: UDP
          listen:
            enabled: true
            port: 22000
            protocol: TCP
          listen-udp:
            enabled: true
            port: 22000
            protocol: UDP
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Syncthing"
          gethomepage.dev/group: "Storage"
          gethomepage.dev/icon: "syncthing.png"
        hosts:
          - host: &host "syncthing.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: syncthing
                  port: 8384
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        # Block storage, not NFS: v2 keeps its indexes in SQLite and SQLite on
        # NFS thrashes (see config-pvc.yaml). Only config + db live here; the
        # synced folders are all under /backups below.
        existingClaim: syncthing-config
        globalMounts:
          - path: /var/syncthing
      backups:
        enabled: true
        existingClaim: nfs-syncthing-backup-pvc
        globalMounts:
          - path: /backups
