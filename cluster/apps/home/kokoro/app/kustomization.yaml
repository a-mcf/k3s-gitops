# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home
resources:
  - ./config-pvc.yaml
  - ./helm-release.yaml
configMapGenerator:
  - name: kokoro-lexicon
    files:
      - lexicon_overrides.py=./resources/lexicon_overrides.py
    options:
      disableNameSuffixHash: true
