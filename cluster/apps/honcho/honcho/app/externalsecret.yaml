---
# PREREQUISITE (manual, one-time): a 1Password item named "honcho" with fields
#   - AUTH_JWT_SECRET      signs API tokens; generate with
#                          scripts/generate_jwt_secret.py (hex, 32 bytes)
#   - LLM_OPENAI_API_KEY   a LiteLLM virtual key limited to qwen38-27b
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: honcho-secret
  namespace: honcho
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-connect
  target:
    name: honcho-secret
    template:
      engineVersion: v2
      data:
        AUTH_JWT_SECRET: "{{ .AUTH_JWT_SECRET }}"
        LLM_OPENAI_API_KEY: "{{ .LLM_OPENAI_API_KEY }}"
  dataFrom:
    - extract:
        key: honcho
